<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5D Budgeting · Acceso de miembros</title>
<style>
  :root{
    --bg-0:#0a0d12;--bg-1:#11161e;--bg-2:#1a2230;--line:#2a3548;--text:#e6ecf5;--text-dim:#8b97aa;
    --accent:#f4b942;--accent-2:#ff5252;--ok:#6bd96b;--viol:#9c6bff;
    --mono:'JetBrains Mono','SF Mono','Menlo',monospace;--display:'Space Grotesk','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(156,107,255,.12),transparent),var(--bg-0);color:var(--text);font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  a{color:var(--accent);text-decoration:none}
  .brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px;margin-bottom:4px;text-align:center;cursor:pointer}
  .brand span{color:var(--viol);font-size:10px;letter-spacing:3px;display:block;line-height:1.6}
  .card{width:min(420px,94vw);background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin-top:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .tabs{display:flex;gap:6px;background:var(--bg-0);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}
  .tab{flex:1;padding:9px;text-align:center;border-radius:7px;cursor:pointer;color:var(--text-dim);font-family:var(--mono);font-size:12px}
  .tab.on{background:var(--accent);color:#1a1305;font-weight:700}
  .ctl{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .ctl label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)}
  .ctl input{background:var(--bg-0);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;font-family:var(--mono);font-size:13px}
  .ctl input:focus{outline:none;border-color:var(--accent)}
  .btn{width:100%;padding:12px;background:var(--accent);color:#1a1305;border:none;border-radius:9px;font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer;margin-top:4px}
  .btn:hover{filter:brightness(1.05)}
  .btn.g{background:#fff;color:#1a1305;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px}
  .sep{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:10px;margin:14px 0 2px}
  .sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}
  .link{color:var(--accent);cursor:pointer;font-size:11px}
  .msg{margin-top:12px;font-size:11px;text-align:center;min-height:16px}
  .msg.err{color:var(--accent-2)} .msg.ok{color:var(--ok)}
  .foot{margin-top:16px;font-size:10px;color:var(--text-dim);text-align:center;line-height:1.7}
  .badge{display:inline-block;padding:2px 8px;border-radius:9px;font-size:9px;letter-spacing:.5px;margin-top:6px}
  .badge.cloud{background:rgba(107,217,107,.16);color:var(--ok)} .badge.local{background:rgba(244,185,66,.16);color:var(--accent)}
  .hidden{display:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="firebase-config.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="saas.js"></script>
</head>
<body>
  <div class="brand" onclick="location.href='index.html'">5D BUDGETING<span>LIFECITY · ACCESO DE MIEMBROS</span></div>
  <div style="text-align:center"><span id="mode-badge" class="badge local">…</span></div>
  <div class="card">
    <div class="tabs">
      <div class="tab on" data-t="login">Iniciar sesión</div>
      <div class="tab" data-t="signup">Crear cuenta</div>
    </div>

    <form id="form-login">
      <div class="ctl"><label>Correo</label><input id="li-email" type="email" autocomplete="email" placeholder="tu@correo.com"></div>
      <div class="ctl"><label>Contraseña</label><input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn" type="submit">Entrar a mi dashboard</button>
      <div style="text-align:right;margin-top:8px"><span class="link" id="link-reset">¿Olvidaste tu contraseña?</span></div>
    </form>

    <form id="form-signup" class="hidden">
      <div class="ctl"><label>Nombre</label><input id="su-name" placeholder="Nombre y apellido"></div>
      <div class="ctl"><label>Correo</label><input id="su-email" type="email" autocomplete="email" placeholder="tu@correo.com"></div>
      <div class="ctl"><label>Contraseña</label><input id="su-pass" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres"></div>
      <button class="btn" type="submit">Crear cuenta y empezar</button>
    </form>

    <div id="google-wrap" class="hidden">
      <div class="sep">o</div>
      <button class="btn g" id="btn-google"><svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.8h12.4c-.3 2.1-1.6 5.2-4.6 7.3l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.5z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.3-8.8 2.3-6.3 0-11.7-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg> Continuar con Google</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="foot" id="foot"></div>
  </div>

<script>
const $=id=>document.getElementById(id);
const QS=new URLSearchParams(location.search);
const NEXT=QS.get('next')||'dashboard.html';
const msg=(t,cls)=>{const m=$('msg');m.textContent=t;m.className='msg '+(cls||'');};

(async()=>{
  await SAAS.ready;
  const cloud = SAAS.configured;
  $('mode-badge').textContent = cloud ? '☁ Cuentas en la nube (Firebase)' : '⚠ Modo local (configura Firebase)';
  $('mode-badge').className = 'badge '+(cloud?'cloud':'local');
  $('google-wrap').classList.toggle('hidden', !cloud);
  $('link-reset').style.display = cloud ? '' : 'none';
  $('foot').innerHTML = cloud
    ? '🔒 Tus proyectos se guardan en tu cuenta y se sincronizan en todos tus dispositivos.'
    : '⚠ Aún en modo local (este navegador). Para SaaS real, pega tu config en <b>firebase-config.js</b> (ver FIREBASE-SETUP.md).';
  if(SAAS.uid) location.replace(NEXT);
})();

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('form-login').classList.toggle('hidden',t.dataset.t!=='login');
  $('form-signup').classList.toggle('hidden',t.dataset.t!=='signup');
  msg('');
});

$('form-login').onsubmit=async e=>{
  e.preventDefault();
  try{ msg('Entrando…'); await SAAS.loginEmail($('li-email').value,$('li-pass').value); location.href=NEXT; }
  catch(err){ msg(traducir(err),'err'); }
};
$('form-signup').onsubmit=async e=>{
  e.preventDefault();
  try{ msg('Creando cuenta…'); await SAAS.signupEmail($('su-email').value,$('su-name').value,$('su-pass').value); location.href=NEXT; }
  catch(err){ msg(traducir(err),'err'); }
};
$('btn-google').onclick=async()=>{
  try{ msg('Abriendo Google…'); await SAAS.loginGoogle(); location.href=NEXT; }
  catch(err){ msg(traducir(err),'err'); }
};
$('link-reset').onclick=async()=>{
  const email=($('li-email').value||'').trim();
  if(!email){ msg('Escribe tu correo arriba y vuelve a pulsar.','err'); return; }
  try{ await SAAS.resetPassword(email); msg('Te enviamos un correo para restablecer la contraseña ✓','ok'); }
  catch(err){ msg(traducir(err),'err'); }
};
function traducir(err){
  const c=(err&&err.code)||''; const m=(err&&err.message)||String(err);
  if(/email-already-in-use/.test(c)) return 'Ya existe una cuenta con ese correo — inicia sesión.';
  if(/invalid-email/.test(c)) return 'Correo no válido.';
  if(/weak-password/.test(c)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/user-not-found|wrong-password|invalid-credential/.test(c)) return 'Correo o contraseña incorrectos.';
  if(/popup-closed-by-user/.test(c)) return 'Cerraste la ventana de Google.';
  if(/unauthorized-domain/.test(c)) return 'Dominio no autorizado en Firebase (agrégalo en Authentication → Settings → Authorized domains).';
  return m;
}
if(QS.get('signup')) document.querySelector('.tab[data-t="signup"]').click();
</script>
</body>
</html>
