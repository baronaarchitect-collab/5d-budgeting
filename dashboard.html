<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5D Budgeting · Mi dashboard</title>
<style>
  :root{
    --bg-0:#0a0d12;--bg-1:#11161e;--bg-2:#1a2230;--line:#2a3548;--text:#e6ecf5;--text-dim:#8b97aa;
    --accent:#f4b942;--accent-2:#ff5252;--accent-3:#4dd0e1;--ok:#6bd96b;--viol:#9c6bff;
    --mono:'JetBrains Mono','SF Mono','Menlo',monospace;--display:'Space Grotesk','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg-0);color:var(--text);font-family:var(--mono);font-size:12px}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:linear-gradient(90deg,var(--bg-1),var(--bg-0));border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .brand{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.5px;cursor:pointer}
  header .brand span{color:var(--viol);font-size:9px;letter-spacing:2px;display:block;line-height:1.4}
  header .grow{flex:1}
  .who{font-size:11px;color:var(--text-dim)}.who b{color:var(--text)}
  .chip{padding:3px 9px;border-radius:9px;font-size:9px;letter-spacing:.5px}
  .chip.cloud{background:rgba(107,217,107,.16);color:var(--ok)} .chip.local{background:rgba(244,185,66,.16);color:var(--accent)}
  .chip.pro{background:rgba(156,107,255,.18);color:var(--viol)}
  .btn{padding:9px 14px;background:var(--bg-2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:#232c3d;border-color:var(--accent)}
  .btn .ic{color:var(--accent);font-weight:700}
  .btn.primary{background:var(--accent);color:#1a1305;border-color:var(--accent);font-weight:600}.btn.primary .ic{color:#1a1305}
  main{max-width:1100px;margin:0 auto;padding:26px 22px 60px;display:flex;flex-direction:column;gap:18px}
  h2{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--viol);padding:14px;display:flex;flex-direction:column;gap:7px;cursor:pointer;position:relative}
  .card:hover{background:#212a3b;border-color:var(--accent)}
  .card .t{font-family:var(--display);font-weight:600;font-size:14px;padding-right:82px}
  .card .m{font-size:10px;color:var(--text-dim)}.card .m b{color:var(--text)}
  .card .del{position:absolute;top:9px;right:9px;color:var(--text-dim);font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--bg-1)}.card .del:hover{color:var(--accent-2);border-color:var(--accent-2)}
  .card .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:9px;letter-spacing:.5px;background:rgba(156,107,255,.18);color:var(--viol)}
  .pill.ok{background:rgba(107,217,107,.18);color:var(--ok)}
  .pill.warn{background:rgba(244,185,66,.18);color:var(--accent)}
  .empty{color:var(--text-dim);padding:40px;text-align:center;font-style:italic;border:1px dashed var(--line)}
  .hint{font-size:10px;color:var(--text-dim);line-height:1.6}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="firebase-config.js?v=3"></script>
<script src="config.js?v=3"></script>
<script src="auth.js?v=3"></script>
<script src="saas.js?v=3"></script>
</head>
<body>
<header>
  <div class="brand" onclick="location.href='index.html'">5D BUDGETING<span>PRESUPUESTACIÓN · LIFECITY BIM HUB</span></div>
  <span id="chip-mode" class="chip local">…</span>
  <span id="chip-pro" class="chip pro" style="display:none">★ Pro</span>
  <div class="grow"></div>
  <span class="who" id="who"></span>
  <a class="btn" href="bienvenida.html" title="Guía rápida y trucos"><span class="ic">💡</span> Tips</a>
  <button class="btn primary" id="btn-nuevo"><span class="ic">+</span> Nuevo proyecto</button>
  <button class="btn" id="btn-logout"><span class="ic">⏻</span> Salir</button>
</header>
<main>
  <h2>Mis proyectos de presupuesto</h2>
  <div id="grid"><div class="empty">Cargando…</div></div>
  <p class="hint" id="foot"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>'$'+(n||0).toLocaleString('es-CO');
let me=null;

(async()=>{
  await SAAS.ready;
  if(!SAAS.guard()) return;
  me=SAAS.user;
  $('who').innerHTML = 'Sesión: <b>'+ (SAAS.currentName()||'') +'</b>';
  const cloud=SAAS.configured;
  $('chip-mode').textContent = cloud?'☁ Nube':'⚠ Local';
  $('chip-mode').className='chip '+(cloud?'cloud':'local');
  if(SAAS.isPro()){ $('chip-pro').style.display=''; }
  $('foot').innerHTML = cloud
    ? 'Tus proyectos se guardan en tu cuenta (Firestore) y se sincronizan en todos tus dispositivos.'
    : '⚠ Modo local: los proyectos viven en este navegador. Configura Firebase (FIREBASE-SETUP.md) para SaaS real.';
  render();
})();

$('btn-logout').onclick=async()=>{ await SAAS.logout(); location.href='index.html'; };

async function render(){
  const grid=$('grid'); grid.innerHTML='<div class="empty">Cargando…</div>';
  const m=await SAAS.listProjects();
  grid.innerHTML='';
  const keys=Object.keys(m).sort((a,b)=>(m[b].savedAt||'').localeCompare(m[a].savedAt||''));
  if(!keys.length){grid.innerHTML='<div class="empty">Sin proyectos aún — crea el primero con «Nuevo proyecto»</div>';return;}
  for(const k of keys){
    const p=m[k];
    const dirTot=(p.presupuesto&&p.presupuesto.totalDirecto)||0, indTot=(p.presupuesto&&p.presupuesto.totalIndirecto)||0;
    const nActs=((p.actividadesIfc&&p.actividadesIfc.length)||0), nMats=((p.materiales&&p.materiales.length)||0);
    const modelo=(p.model&&p.model.fileName)||'sin modelo';
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div class="t">${p.nombre||k}</div>
      <div class="pills"><span class="pill">${nActs} actividades IFC</span><span class="pill ${nMats?'ok':'warn'}">${nMats} materiales</span></div>
      <div class="m">Presupuesto: <b>${fmt(dirTot+indTot)}</b></div>
      <div class="m">Modelo: <b>${modelo}</b></div>
      <div class="m">Guardado: <b>${p.savedAt?new Date(p.savedAt).toLocaleString('es-CO'):'—'}</b></div>
      <div class="del" title="Eliminar proyecto">🗑 Eliminar</div>`;
    card.onclick=async e=>{
      if(e.target.classList.contains('del')){
        if(confirm(`¿Eliminar el proyecto "${p.nombre||k}"? Esta acción no se puede deshacer.`)){
          await SAAS.deleteProject(k); render();
        }
        return;
      }
      location.href='presupuesto.html?id='+encodeURIComponent(k);
    };
    grid.appendChild(card);
  }
}

$('btn-nuevo').onclick=async()=>{
  const nombre=prompt('Nombre del proyecto (ej: Edificio San Fernando):');
  if(!nombre)return;
  const id=nombre.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString(36);
  await SAAS.saveProject(id,{id,nombre,savedAt:new Date().toISOString()});
  location.href='presupuesto.html?id='+encodeURIComponent(id);
};
</script>
</body>
</html>
